name: Terraform PR plan (bonus example — WIF must be configured)
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with GitHub OIDC (no JSON keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init (platform remote state)
        run: terraform -chdir=infra/platform init -input=false -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"
      - name: Terraform plan only (no apply)
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: europe-west1
        run: terraform -chdir=infra/platform plan -input=false -no-color
